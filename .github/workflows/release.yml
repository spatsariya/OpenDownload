name: Publish Windows preview
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify transfer engine
        run: python -m unittest -v test_engine.py
      - name: Build Windows MSI
        shell: powershell
        run: .\packaging\build.ps1
      - name: Verify packaged application starts
        shell: pwsh
        run: |
          $result = Join-Path $PWD 'build/frozen-smoke.json'
          $exe = Join-Path $PWD 'dist/OpenDownload/OpenDownload.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test',('\"' + $result + '\"') -PassThru -Wait -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw 'Packaged app failed to start' }
          $report = Get-Content -LiteralPath $result -Raw | ConvertFrom-Json
          if (!$report.ok -or !$report.frozen) { throw 'Packaged app self-check failed' }
      - name: Attach installer and publish preview
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = 'release/OpenDownload-0.1.0-x64.msi'
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $PWD 'release/SHA256SUMS.txt'), $hash + '  OpenDownload-0.1.0-x64.msi' + [Environment]::NewLine, [Text.Encoding]::ASCII)
          gh release upload v0.1.0 $installer release/SHA256SUMS.txt release/INSTALLING.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          gh release edit v0.1.0 --draft=false --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
