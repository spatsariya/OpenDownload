plugins { id 'com.android.application' }
android {
    namespace 'io.github.spatsariya.opendownload'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.spatsariya.opendownload'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        testInstrumentationRunner 'io.github.spatsariya.opendownload.SmokeInstrumentation'
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('ANDROID_KEYSTORE_PATH') ?: 'missing-release-key.jks')
            storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            keyAlias 'opendownload'
            keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release; minifyEnabled false }
    }
}
